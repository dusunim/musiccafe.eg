<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111310" />
  <title>Music Cafe — 나의 강의실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="resources.css" />
</head>
<body class="locked">
  <div class="auth-gate" id="authGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <form class="auth-card" id="authForm">
      <div class="auth-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="auth-eyebrow">PRIVATE CLASSROOM</p>
      <h1 id="authTitle">강의실 잠금 해제</h1>
      <p>계속하려면 암호를 입력해주세요.</p>
      <label for="passwordInput">암호</label>
      <div class="password-field">
        <input id="passwordInput" type="password" autocomplete="current-password" required autofocus />
        <button type="button" id="togglePassword" aria-label="암호 표시">보기</button>
      </div>
      <button class="unlock-button" type="submit">강의실 입장</button>
      <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>
    </form>
  </div>
  <main id="course">
    <section class="classroom">
      <div class="stage">
        <div class="video-shell" id="videoShell">
          <video id="player" controls controlslist="nodownload" playsinline></video>
          <div class="empty-state" id="emptyState">
            <div class="play-orbit"><span>▶</span></div>
            <p class="empty-kicker">YOUR PRIVATE CLASSROOM</p>
            <h2>강의실을 준비하고 있어요</h2>
            <p>잠시만 기다려주세요.</p>
          </div>
        </div>

        <div class="lesson-info">
          <div>
            <span class="now-playing">NOW PLAYING</span>
            <h2 id="currentTitle">동영상을 선택해주세요</h2>
          </div>
          <div class="lesson-actions">
            <button class="nav-btn" id="prevBtn" disabled aria-label="이전 강의">← <span>이전 강의</span></button>
            <button class="complete-btn" id="completeBtn" disabled><span>✓</span> 완료 후 다음 강의</button>
            <button class="nav-btn" id="nextBtn" disabled aria-label="다음 강의"><span>다음 강의</span> →</button>
          </div>
        </div>

        <div class="tabs" id="notes">
          <button class="active" data-tab="about">강의 소개</button>
          <button data-tab="transcript">전체 스크립트</button>
          <button data-tab="resources">강의 자료</button>
          <button data-tab="note">나의 노트</button>
          <button data-tab="shortcut">단축키</button>
        </div>
        <div class="tab-content" id="tabContent">
          <p>로컬에 보관한 영상을 안전하게 재생하세요. 선택한 파일은 외부 서버로 전송되지 않으며, 재생 위치와 완료 상태는 이 브라우저에 저장됩니다.</p>
        </div>
      </div>

      <aside class="curriculum">
        <div class="curriculum-head">
          <div>
            <span>CURRICULUM</span>
            <h2>강의 목차</h2>
          </div>
          <div class="curriculum-tools">
            <button id="expandAll">모두 펼치기</button>
            <button id="collapseAll">모두 접기</button>
          </div>
        </div>
        <div class="progress-copy"><span>전체 진도율</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div class="playlist" id="playlist">
          <div class="playlist-empty">
            <span>♪</span>
            <strong>아직 강의가 없어요</strong>
            <p>동영상을 추가하면 파일명 순서로<br>강의 목차가 만들어집니다.</p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script>document.write(`<script src="deploy-config.js?v=${Date.now()}"><\/script>`);</script>
  <script src="auth.js"></script>
  <script src="content/manifest.js"></script>
  <script src="content/transcripts.js"></script>
  <script src="content/resources.js"></script>
  <script src="app.js"></script>
</body>
</html>
